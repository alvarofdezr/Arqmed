name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and Rename APK
        id: apk-path
        run: |
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          TARGET_NAME="arqmed-studio-${TAG_NAME}.apk"
          cp "$RAW_APK" "./$TARGET_NAME"
          echo "APK_PATH=./$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release binary at ./$TARGET_NAME"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "ARQMED Studio ${{ github.ref_name }}"
          files: ${{ steps.apk-path.outputs.APK_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
