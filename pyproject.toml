[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arqmed-studio"
version = "2.0.0"
description = "Motor universal FIEBDC-3 (.bc3) y estudio web de presupuestos y mediciones de obra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
arqmed-export = "src.bc3_exporter:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
